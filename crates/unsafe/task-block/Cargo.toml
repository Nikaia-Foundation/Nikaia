[package]
name = "task-block"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A task's memory block of 16 pages of 4 KiB, each counting what it holds, and the lists and text whose growth it may refuse."
publish = false

[dependencies]
# `Vec<T, A>` on stable Rust, with an allocator that may refuse. Only `alloc`,
# as `nikaia-std`'s hashbrown has it.
allocator-api2 = { version = "0.2", default-features = false, features = ["alloc"] }

# Its own workspace: its own lock file, its own checks, its own toolchain for
# them (see README.md). Nikaia's workspace reaches it as a path dependency.
[workspace]
