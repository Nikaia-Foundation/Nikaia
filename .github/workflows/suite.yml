name: Suite

# **The suite of one architecture: build once, test in shards, sweep**
# (#437, the owner's goal of 2026-11-14: a run in minutes). `nikaia.yml` calls
# it once for x86-64 and, where `scripts/ci-changes.sh` says so, once for
# 64-bit ARM, with the same jobs, the same shards and the same scripts: one
# definition, so the two cannot drift. Each architecture builds once - its
# binaries cannot run on the other - and its shards reuse that build.
#
# 64-bit ARM (aarch64 Linux: Graviton, Ampere, a Raspberry Pi 4/5, Apple
# silicon under Linux): nothing in the tree names the architecture - no
# `asm!`, no `target_arch`, and the triple the `target` switch names is never
# handed to `rustc` - so a build there is a native build, and its leg is what
# says it stays one. The `unsafe` crates' tests run there too (`unsafe_native`):
# atomics and memory ordering are where a weaker memory model than x86's would
# show. Their lints and Miri run once, on x86 (`unsafe_crates` in nikaia.yml).
#
# What does not depend on the architecture runs on x86 only: the samples, the
# page examples and the ledgers (shard `ledgers`), and the sweep's allow-list check
# reads file names, once, for the x86 leg.
on:
  workflow_call:
    inputs:
      arch:
        description: "x64 or arm64: names the artifacts and the cache"
        required: true
        type: string
      runner:
        description: "the runner label of that architecture"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # **Build once, test in parallel** (the owner's goal, 2026-11-14: a run in
  # minutes, not 40-70). The full suite was one `cargo test` on four threads:
  # the 2885 short tests were done after 27 minutes, and twelve whole-tree
  # tests held the step to 43 - the compiler's test package at both settings
  # alone took 38 minutes. Now `build` compiles the workspace and every test
  # binary once and hands `target/release` on as an artifact; each `test`
  # shard runs its part of the binaries directly (no second `cargo`, which
  # would rebuild every workspace crate after a fresh checkout) and sweeps
  # the programs its tests accepted; `sweep` checks the allow-list against
  # the dumps of all shards.
  #
  # One toolchain per leg (ADR-001 D1): `rust-toolchain.toml` names it and
  # `rustup show` installs it. The build records its `rustc -V` in the
  # artifact and every test shard runs that exact version (#2116): runners
  # of one run may carry images with different stables.
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      # **Nothing built twice, across runs either.** The build is
      # incremental and its state is cached per commit: the next run restores
      # the newest one and rustc recompiles only what changed (measured
      # 2026-11-20, run 44726537733: arm64 with no cache 4:53; x86 with the cache of a
      # commit 207 files back, 23 of 196 targets compiled, `std` once,
      # 1:56). The sources unchanged since the cached commit are dated back
      # first, or the checkout's fresh mtimes rebuild every crate (#2403).
      # A cache keyed on `Cargo.lock` alone hit exactly
      # and was never saved again, so our own crates were rebuilt every time.
      - name: Restore the build of an earlier commit
        id: incr
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-incr-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-incr-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-incr-

      # **Unchanged sources are dated back before the build** (#2403). Cargo
      # holds a path crate fresh only while no source is newer than its
      # dep-info, and the checkout writes every file at checkout time, so a
      # warm cache rebuilt every workspace crate (3:08 with no crate changed,
      # run 44711416045). The restored tree is the build of the commit the
      # matched key ends in: every file that commit and this one share gets
      # 2000-01-01, older than any build output; a file changed since keeps
      # the checkout time and is rebuilt. Not every file to 2000: a changed
      # one would then look older than its stale output. Only that commit is
      # fetched, by sha, at depth 1: two trees are all `git diff` needs.
      - name: Date the sources the restored build was made from
        if: steps.incr.outputs.cache-matched-key != ''
        env:
          KEY: ${{ steps.incr.outputs.cache-matched-key }}
        run: |
          base=${KEY##*-}
          if ! [[ $base =~ ^[0-9a-f]{40}$ ]]; then
            echo "no commit in the matched key $KEY: nothing dated"; exit 0
          fi
          if [ "$base" != "$GITHUB_SHA" ] && ! git fetch -q --depth=1 origin "$base"; then
            echo "commit $base of the cache is gone: nothing dated, all rebuilt"; exit 0
          fi
          git diff --name-only --no-renames "$base" "$GITHUB_SHA" >"$RUNNER_TEMP/changed"
          echo "changed since the cached commit $base: $(wc -l <"$RUNNER_TEMP/changed") files"
          git ls-files -z | grep -zvxFf "$RUNNER_TEMP/changed" |
            xargs -0 -r touch -d '2000-01-01 00:00:00 UTC'

      # Every test binary and the directory cargo would run it in (its
      # package's), one per line: what the shards run. **Each crate is
      # compiled once** (#2083): the unit tests, the integration tests and the
      # binaries they start are built in one cargo run, at release, and share
      # every library. Only the `cfg(test)` copies of the crates that still
      # have unit tests come on top; `std` has none (`test = false`, #2082),
      # and `--tests` builds exactly the targets with `test = true` (`--lib`
      # would build `std`'s harness all the same). Before, the unit
      # tests were built at `dev` beside it, so every library they needed was
      # compiled twice.
      - name: Build the tests
        env:
          CARGO_INCREMENTAL: 1
        run: |
          set -o pipefail
          mkdir -p target/release
          list() {
            jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                   | "\(.executable)\t\(.manifest_path | sub("/Cargo.toml$"; ""))"'
          }
          cargo test --workspace --release --no-run --tests --message-format=json >"$RUNNER_TEMP/build.json"
          list <"$RUNNER_TEMP/build.json" | sort -u >target/release/test-binaries.tsv
          cat target/release/test-binaries.tsv
          # What was compiled, not taken fresh from the cache (#2403): with
          # no crate changed, only the crates' names that a change reaches.
          jq -r 'select(.reason == "compiler-artifact" and .fresh == false) | .target.name' "$RUNNER_TEMP/build.json" |
            sort | uniq -c | sort -rn >"$RUNNER_TEMP/compiled"
          echo "compiled: $(wc -l <"$RUNNER_TEMP/compiled") targets, fresh: $(jq -s '[.[] | select(.reason == "compiler-artifact" and .fresh)] | length' "$RUNNER_TEMP/build.json")"
          head -40 "$RUNNER_TEMP/compiled"

      # What the test run did not need (the bench binaries): only links.
      - name: Build the rest of the workspace
        env:
          CARGO_INCREMENTAL: 1
        run: cargo build --workspace --release

      # **The solver program is built once per run and arch, here** (#2087),
      # not in every `compiler-*` shard that has a test running
      # `scripts/solver.nika` (all five had one: about 100 s each, per
      # arch). `scripts/solver.nika -- build` keeps the binary in
      # `target/solver-rod/<key>/` (#2023), the key the program's files and
      # the path, size and age of the `nikaia` that builds it; the tar below
      # carries both the binary and this `nikaia` with its age, the shards
      # unpack them on the same path, and their solver tests find it and build
      # nothing - against the program this run's compiler built (#2075).
      # Built before the tests at all (#2023): the first test to run it paid
      # the build inside its 300 s, which `solver_sample` overran.
      # Here and not in a job of its own: a matrix shares its `needs`, so all
      # fourteen shards would wait for such a job, not only the five.
      # It builds with the shards' program `std` (same key, restored, never
      # saved here: compiler-0 saves it) and a rustc store of its own
      # (ADR-021 D14); both live in `target/nikaia-project-tests`, removed
      # again before the build is saved. The wrapper's trace says per crate
      # whether rustc ran or its outputs were reused from the store.
      - name: Name the program std
        id: rlib-key
        run: echo "rustc=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >>"$GITHUB_OUTPUT"

      - name: Restore the program std
        id: rlib
        uses: actions/cache/restore@v4
        with:
          path: target/nikaia-project-tests/rlib
          key: rlib-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-${{ hashFiles('crates/nikaia-std/**', '!crates/nikaia-std/src/compiler/**', 'crates/unsafe/**', 'Cargo.lock') }}
          restore-keys: rlib-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-

      - name: Restore the solver's rustc store
        uses: actions/cache/restore@v4
        with:
          path: target/nikaia-project-tests/rustc
          key: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-solver-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-solver-

      # As in the shards: on an exact hit the sources are dated back, so
      # Cargo builds no `std` crate. After the workspace's build, which this
      # does not touch.
      - name: Date the std sources before the restored tree
        if: steps.rlib.outputs.cache-hit == 'true'
        run: |
          git ls-files -z -- crates/nikaia-std crates/unsafe ':!crates/nikaia-std/src/compiler' |
            xargs -0 touch -d '2000-01-01 00:00:00 UTC'

      # A solver that does not build fails its tests in the shards, which
      # then build it themselves and say why; it does not hold back the
      # other shards.
      # Named by its absolute path (#1949): the build runs this script again
      # in its slot by `env::current_main`, an absolute path, and the path
      # shown is part of the program's Rust (ADR-300 D9); run as
      # `scripts/solver.nika` it was lowered twice, about 3.5 s.
      - name: Build the solver program
        continue-on-error: true
        run: |
          trace="$RUNNER_TEMP/solver-trace"
          env -u CARGO_TARGET_DIR NIKAIA_CACHE_DIR="$PWD/target/nikaia-project-tests" NIKAIA_WRAPPER_TRACE="$trace" \
            ./target/release/nikaia run "$PWD/scripts/solver.nika" -- build
          echo "rustc per crate (ran: compiled; reused: from the store):"
          sort "$trace" 2>/dev/null | uniq -c || true

      # The compiler, `std`'s rlibs (the tests hand emitted programs to rustc
      # with `--extern` into `deps/`) and the test binaries; not cargo's
      # bookkeeping. Every shard runs on the same path, so the paths compiled
      # into the binaries (`CARGO_BIN_EXE_nikaia`, the checkout) hold there.
      - name: Pack the build
        run: |
          rustc -V >target/release/rustc-version
          rustc --print sysroot >target/release/rustc-sysroot
          tar --exclude=target/release/incremental --exclude=target/release/.fingerprint -I 'zstd -T0 -1' \
            -cf "$RUNNER_TEMP/release.tar.zst" target/release \
            $(ls -d target/solver-rod 2>/dev/null)

      - uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ inputs.arch }}
          path: ${{ runner.temp }}/release.tar.zst
          retention-days: 1
          compression-level: 0

      # On `develop` only, as the build (#2087).
      - name: Save the solver's rustc store
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@v4
        with:
          path: target/nikaia-project-tests/rustc
          key: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-solver-${{ github.run_id }}-${{ github.run_attempt }}

      # After the artifact, so the shards do not wait for it. The solver's
      # caches and binary are not part of the build (their own keys). Only the newest
      # incremental session of each crate is kept; rustc would otherwise
      # carry every earlier one along.
      - name: Keep the newest incremental session
        run: |
          # `target/debug` is no longer built (#2083); a cache from before
          # still holds one.
          rm -rf target/nikaia-project-tests target/solver-rod target/debug
          for d in target/release/incremental/*/; do
            ls -dt "$d"s-*/ 2>/dev/null | tail -n +2 | while read -r old; do
              rm -rf "$old" "${old%/}.lock"
            done
          done
          du -sh target ~/.cargo/registry || true

      # **The big caches are saved on `develop` only** (#2087): every other
      # branch restores, never saves. One run wrote about 3.5 GB (both
      # arches), the repository holds 10 GB, and the `ci/*` runs saved theirs
      # like a `develop` run, so `develop`'s own entries were evicted before
      # the next commit could restore them (x64 missed in most runs). GitHub
      # lets a branch restore only its own and the default branch's entries,
      # so a `ci/*` run's saves served nobody but its own next run.
      # The registry alone, for the shards' "Restore the cargo registry"
      # (#2092): a cache hits only with the same path list, and nothing saved
      # this one, so every shard missed. Once per `Cargo.lock`; a key that
      # exists already is not written again.
      - name: Save the cargo registry for the shards
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Save the build for the next commit
        if: github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-incr-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

  # The `unsafe` crates' own tests on ARM, natively, beside the build (the
  # memory-model check; lints and Miri run on x86 in nikaia.yml).
  unsafe_native:
    if: inputs.arch == 'arm64'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Test the unsafe crates
        run: |
          for dir in crates/unsafe/*/; do
            echo "::group::$dir"
            (cd "$dir" && cargo test --quiet --all-features)
            echo "::endgroup::"
          done

  # **The suite, in shards that run at once.** `it-K` is every K-th short
  # test of the `it` binary (round-robin over the sorted names, so each module
  # spreads over all three), `it-0` also every other test binary; `heavy-*`
  # are the whole-tree tests, two or three to a runner where they fit beside
  # each other; `compiler-K` is every K-th program of `tests/compiler`, at
  # both settings - the test `the_compiler_test_package_passes_at_both_settings`
  # runs that package in one go and is skipped in the `it` shards for it.
  # A new whole-tree test that makes an `it` shard slow belongs in `HEAVY`.
  test:
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - it-0
          - it-1
          - it-2
          - heavy-map-trust
          - heavy-sysroot-cores
          - heavy-sysroot-pair
          - heavy-corpus
          - heavy-rest
          - compiler-0
          - compiler-1
          - compiler-2
          - compiler-3
          - compiler-4
          - ledgers
        # **The one-thread lowering runs weekly and by hand only** (CI speed):
        # it is the whole tools package again on one core, the longest shard
        # of a push (7 min), and `heavy-sysroot-pair` lowers the same package
        # on every core against the committed bytes on every push, with a
        # different interleaving of files on threads each time.
        exclude:
          - shard: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'none' || 'heavy-sysroot-cores' }}
          # The samples, the page examples and the ledgers do not depend on
          # the architecture: x86 only.
          - shard: ${{ inputs.arch == 'arm64' && 'ledgers' || 'none' }}
    env:
      SHARD: ${{ matrix.shard }}
      IT_SHARDS: 3
      COMPILER_SHARDS: 5
      # The whole-tree tests of `it`, by shard; every one is skipped in `it-K`.
      HEAVY_MAP_TRUST: map_trust::the_real_tools_package_lowers_the_same_read_backwards
      HEAVY_SYSROOT_CORES: sysroot::the_tools_lower_the_same_on_one_thread_as_on_every_core
      HEAVY_SYSROOT_PAIR: >-
        sysroot::the_committed_rust_is_what_this_compiler_lowers
      HEAVY_CORPUS: >-
        sequences::the_corpus_has_no_more_unanswered_method_calls_than_it_had
        language::the_build_time_package_passes_its_own_tests
      HEAVY_REST: >-
        project::the_http_package_serves_its_example
        bytes::the_corpus_needs_no_tether
        contracts::a_toolchain_module_is_not_part_of_std
        fmt::every_nika_file_formats_to_the_same_tree_and_a_fixed_point
      HEAVY_ELSEWHERE: nikaia_test::the_compiler_test_package_passes_at_both_settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      # The crates.io sources the tests' own Cargo builds read offline (a
      # test that builds a Rust library resolves `winnow`'s dependencies).
      - name: Restore the cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ inputs.arch == 'arm64' && 'ARM64-' || '' }}cargo-stable-

      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ inputs.arch }}
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: tar -I zstd -xf "$RUNNER_TEMP/release.tar.zst"

      # The rlibs in `deps/` link only with the rustc that wrote them
      # (E0514 otherwise, #2116): this shard's image may carry another stable.
      - name: Use the rustc the build used
        run: |
          built="$(cat target/release/rustc-version)"
          if [ "$(rustc -V)" != "$built" ]; then
            version="$(echo "$built" | cut -d' ' -f2)"
            rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
            echo "RUSTUP_TOOLCHAIN=$version" >>"$GITHUB_ENV"
            export RUSTUP_TOOLCHAIN="$version"
          fi
          if [ "$(rustc -V)" != "$built" ]; then
            echo "::error::the build used $built, this shard has $(rustc -V)"
            exit 1
          fi
          # The tests hand emitted programs to the `rustc` path the build
          # script baked in (cargo's resolved one, the `stable-*` directory),
          # not to PATH: where that directory holds another version, point it
          # at the one the build used (#2116).
          baked="$(cat target/release/rustc-sysroot)"
          if [ "$("$baked/bin/rustc" -V 2>/dev/null)" != "$built" ]; then
            rm -rf "$baked"
            ln -s "$(rustc --print sysroot)" "$baked"
            "$baked/bin/rustc" -V
          fi
          rustc -V

      # How long each program of `tests/compiler` took last time: `nikaia
      # test` starts the longest first (#1600). Restored from the newest run
      # of this shard, saved as this run's after the tests.
      - name: Restore the test times
        if: startsWith(matrix.shard, 'compiler-')
        uses: actions/cache/restore@v4
        with:
          path: target/nikaia-project-tests/test-times
          key: test-times-${{ inputs.arch }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-times-${{ inputs.arch }}-${{ matrix.shard }}-

      # **The program `std` is built once per std, not once per shard and run**
      # (#1956). The rlib tree a test program links (`$NIKAIA_CACHE_DIR/rlib`,
      # `Sysroot::rlib_cache`: about 70 crates, rustls, ring, regex_automata)
      # is named by the toolchain, target and codegen, not by the compiler,
      # so a tree of an earlier commit serves this one. The key hashes what a
      # program's `std` compiles: its sources and those of its path crates,
      # without `src/compiler` (the `compiler` feature, off in a program's
      # `std`, #723), so a push that changes only the compiler hits exactly.
      # A near tree (another std) is restored too: Cargo rebuilds only the
      # path crates, never the registry ones.
      - name: Name the program std
        id: rlib-key
        if: startsWith(matrix.shard, 'compiler-')
        run: |
          echo "rustc=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >>"$GITHUB_OUTPUT"
          # Every source is older than this; every unit Cargo builds in this
          # run is newer (the save below keeps only those of the path crates).
          touch "$RUNNER_TEMP/checked-out"

      - name: Restore the program std
        id: rlib
        if: startsWith(matrix.shard, 'compiler-')
        uses: actions/cache/restore@v4
        with:
          path: target/nikaia-project-tests/rlib
          key: rlib-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-${{ hashFiles('crates/nikaia-std/**', '!crates/nikaia-std/src/compiler/**', 'crates/unsafe/**', 'Cargo.lock') }}
          restore-keys: rlib-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-

      # **What `rustc` wrote for a crate is kept by the crate's emitted Rust**
      # (#2005, ADR-021 D14): `$NIKAIA_CACHE_DIR/rustc/<key>`, the key the
      # Rust, the arguments, the `--extern` files and `rustc -vV`. A push that
      # changes the compiler but not the Rust of a test program reuses its
      # rlib and binary instead of running `rustc` again. Kept per shard (each
      # builds its own programs), the newest store of an earlier run restored;
      # the builds prune it with the rest of the cache, used longest ago
      # first (D12.5), and "Keep only the std" touches only `rlib`.
      - name: Restore the rustc store
        if: startsWith(matrix.shard, 'compiler-')
        uses: actions/cache/restore@v4
        with:
          path: target/nikaia-project-tests/rustc
          key: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-${{ matrix.shard }}-

      # Cargo judges a path crate by mtimes, and the checkout made every
      # source newer than the restored tree. On an exact hit the sources are
      # the bytes the tree was built from (the key), so they are dated back
      # and Cargo builds no `std` crate. A near tree keeps the new dates and
      # its path crates are rebuilt.
      - name: Date the std sources before the restored tree
        if: steps.rlib.outputs.cache-hit == 'true'
        run: |
          git ls-files -z -- crates/nikaia-std crates/unsafe ':!crates/nikaia-std/src/compiler' |
            xargs -0 touch -d '2000-01-01 00:00:00 UTC'

      # Each one-file program a checker test accepts is written to the dump
      # this shard sweeps (#705).
      - name: Test
        if: matrix.shard != 'ledgers'
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          set -o pipefail
          # With rustup's homes and toolchain fixed, as its proxy sets them
          # under `cargo test` (a test that moves HOME still finds `cargo`,
          # `rustc` and the registry). No LD_LIBRARY_PATH: a program a test
          # builds with `nikaia run` finds the toolchain's `std` by the path
          # written into it (#281, #1584).
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_TOOLCHAIN="$(rustup show active-toolchain | cut -d' ' -f1)"
          # One cache for the whole shard: the tests that name none would
          # otherwise build the `std` rlibs, the build-time parsers and the
          # comptime bundles a second time, in `~/.cache/nikaia`, beside the
          # ones the other tests build in this directory (#1600).
          export NIKAIA_CACHE_DIR="$PWD/target/nikaia-project-tests"
          it=$(awk -F'\t' '$1 ~ /\/it-[0-9a-f]+$/ {print $1}' target/release/test-binaries.tsv)
          itdir=$(awk -F'\t' '$1 ~ /\/it-[0-9a-f]+$/ {print $2}' target/release/test-binaries.tsv)
          heavy="$HEAVY_MAP_TRUST $HEAVY_SYSROOT_CORES $HEAVY_SYSROOT_PAIR $HEAVY_CORPUS $HEAVY_REST $HEAVY_ELSEWHERE"
          run_it() { (cd "$itdir" && "$it" --exact "$@"); }
          case "$SHARD" in
          it-*)
            k=${SHARD#it-}
            (cd "$itdir" && "$it" --list --format terse) | sed -n 's/: test$//p' | sort >"$RUNNER_TEMP/all"
            printf '%s\n' $heavy | sort >"$RUNNER_TEMP/heavy"
            comm -23 "$RUNNER_TEMP/all" "$RUNNER_TEMP/heavy" |
              awk -v k="$k" -v n="$IT_SHARDS" 'NR % n == k' >"$RUNNER_TEMP/mine"
            echo "$(wc -l <"$RUNNER_TEMP/mine") of $(wc -l <"$RUNNER_TEMP/all") tests of it"
            status=0
            xargs -a "$RUNNER_TEMP/mine" -d '\n' sh -c 'd=$0 b=$1; shift; cd "$d" && exec "$b" --exact "$@"' "$itdir" "$it" 2>&1 |
              tee "$RUNNER_TEMP/test.log" || status=1
            if [ "$k" = 0 ]; then
              while IFS="$(printf '\t')" read -r bin dir; do
                [ "$bin" = "$it" ] && continue
                echo "::group::$bin"
                (cd "$dir" && "$bin") 2>&1 | tee -a "$RUNNER_TEMP/test.log" || status=1
                echo "::endgroup::"
              done <target/release/test-binaries.tsv
              # The `test` blocks of the compiler's `.nika` files, compiled
              # into `nikaia` rather than into a `cfg(test)` copy of
              # `nikaia-std` (#2082).
              echo "::group::nikaia test --std"
              ./target/release/nikaia test --std 2>&1 | tee -a "$RUNNER_TEMP/test.log" || status=1
              echo "::endgroup::"
            fi
            exit $status
            ;;
          heavy-*)
            var=HEAVY_$(echo "${SHARD#heavy-}" | tr 'a-z-' 'A-Z_')
            eval "names=\$$var"
            run_it $names 2>&1 | tee "$RUNNER_TEMP/test.log"
            ;;
          compiler-*)
            k=${SHARD#compiler-}
            filters=$(ls tests/compiler/tests/*.nika | sed 's|.*/||; s|\.nika$||' | sort |
              awk -v k="$k" -v n="$COMPILER_SHARDS" 'NR % n == k {printf " --filter %s", $0}')
            # As the test `the_compiler_test_package_passes_at_both_settings` runs it.
            # No dump: `nikaia test` builds every one of these programs with rustc
            # itself, so the accepted-sweep would only check and prove them again.
            # `pre_push_generated` runs the builder's pre-push five times (a whole
            # checkout and `cargo fmt --all` each): about 70 s on a quiet machine,
            # over the default 300 s on a loaded runner (run 46171646174), so the
            # runner raises the limit (`project_tests_time_limit`).
            env -u CARGO_TARGET_DIR -u RUST_BACKTRACE -u NIKAIA_DUMP_ACCEPTED NIKAIA_CACHE_DIR="$PWD/target/nikaia-project-tests" NIKAIA_TEST_TIME_LIMIT=900 \
              ./target/release/nikaia test --both-settings --project tests/compiler $filters 2>&1 |
              tee "$RUNNER_TEMP/test.log"
            ;;
          esac

      - name: Save the test times
        if: always() && startsWith(matrix.shard, 'compiler-')
        uses: actions/cache/save@v4
        with:
          path: target/nikaia-project-tests/test-times
          key: test-times-${{ inputs.arch }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      # On `develop` only, as the build (#2087). The test times stay per run
      # and branch: a few KB per shard.
      - name: Save the rustc store
        if: ${{ !cancelled() && startsWith(matrix.shard, 'compiler-') && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@v4
        with:
          path: target/nikaia-project-tests/rustc
          key: rustc-${{ inputs.arch }}-${{ runner.os }}-${{ steps.rlib-key.outputs.rustc }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      # **Saved once per key, by one shard**: compiler-0 builds the same std
      # as the others, and a key is written once (an exact hit saves
      # nothing). Before the save, what must not travel: the programs'
      # artifacts (tens of MB each, by their project tag, as
      # `cache::sweep_programs` removes them), and each unit of a path crate
      # this run did not build. Such a unit was built from other sources;
      # once the sources are dated back on an exact hit, Cargo would take it
      # as fresh. Without its fingerprint Cargo rebuilds it. Older keys are
      # evicted by GitHub's own rule (least recently used past the
      # repository's 10 GB, or unused for 7 days); the size of a saved tree
      # is printed here.
      - name: Keep only the std of this run
        if: ${{ !cancelled() && matrix.shard == 'compiler-0' && steps.rlib.outputs.cache-hit != 'true' && github.ref == 'refs/heads/develop' }}
        run: |
          names=$(for m in crates/nikaia-std/Cargo.toml crates/unsafe/*/Cargo.toml; do
            sed -n 's/^name = "\(.*\)"$/\1/p;T;q' "$m"; done)
          for tree in target/nikaia-project-tests/rlib/*/; do
            for record in "$tree".nikaia-projects/*; do
              [ -f "$record" ] || continue
              tag=$(basename "$record")
              find "$tree" -mindepth 2 -maxdepth 4 \( -name "*_$tag*" -o -name "*-$tag*" \) -prune -exec rm -rf {} +
            done
            rm -rf "$tree.nikaia-projects"
            find "$tree" -mindepth 4 -maxdepth 5 -path '*/.fingerprint/*/invoked.timestamp' ! -newer "$RUNNER_TEMP/checked-out" |
              while read -r stamp; do
                unit=$(dirname "$stamp")
                name=$(basename "$unit")
                case " $(echo $names) " in *" ${name%-*} "*) rm -rf "$unit" && echo "not saved, built from other sources: $unit" ;; esac
              done
            # Cargo 1.100's layout (#2136): a unit is `build/<crate>/<hash>/`,
            # its fingerprint and its `out/` in it.
            find "$tree" -mindepth 6 -maxdepth 7 -path '*/build/*/*/fingerprint/invoked.timestamp' ! -newer "$RUNNER_TEMP/checked-out" |
              while read -r stamp; do
                unit=$(dirname "$(dirname "$stamp")")
                name=$(basename "$(dirname "$unit")")
                case " $(echo $names) " in *" $name "*) rm -rf "$unit" && echo "not saved, built from other sources: $unit" ;; esac
              done
          done
          du -sh target/nikaia-project-tests/rlib/* || true

      - name: Save the program std
        if: ${{ !cancelled() && matrix.shard == 'compiler-0' && steps.rlib.outputs.cache-hit != 'true' && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@v4
        with:
          path: target/nikaia-project-tests/rlib
          key: ${{ steps.rlib.outputs.cache-primary-key }}

      - name: Name the failing tests
        if: failure()
        run: |
          grep -E '^test .* FAILED|\.\.\. FAILED' "$RUNNER_TEMP/test.log" | sed 's/^/::error::/' | head -50 || true
          awk '/^failures:$/{f=1;next} /^test result/{f=0} f&&/^    /{print "::error::failed: "$1}' "$RUNNER_TEMP/test.log" | sort -u | head -50 || true

      # What were the bootstrap job's last steps; they need the compiler only,
      # so they are a shard of their own beside the tests (CI speed: on it-1
      # they made it one of the longest shards).
      # `nikaia bind java` (ADR-284 D34, #1337) is written against Java 22's
      # java.lang.foreign; the runner's default JDK may be older.
      - name: JDK 22 for the Java binding
        if: matrix.shard == 'ledgers'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: The Java binding prints what use.c prints
        if: matrix.shard == 'ledgers'
        run: ./target/release/nikaia run scripts/java_binding.nika

      - name: The samples, the page examples and the ledgers
        if: matrix.shard == 'ledgers'
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          export PATH="$PWD/target/release:$PATH"
          for sample in tests/samples/*.nika; do
            echo "::group::$sample"
            nikaia interpret "$sample"
            echo "::endgroup::"
          done
          (cd tests/page-examples && nikaia test)
          # A decision is only citable if its number is stable, so a dangling
          # `ADR-023 D7` is as much a defect as a dangling link.
          env -u NIKAIA_DUMP_ACCEPTED nikaia run scripts/check-adr-refs.nika
          # The ledgers of tests/compiler are committed like a lockfile
          # (ADR-268 D2, D6): a change to its src/ that leaves them stale fails.
          (cd tests/compiler && nikaia build --locked)
          # So are those of every example and package with one, built on a
          # clean target where no warm cache hides a new proof question (#1591).
          env -u NIKAIA_DUMP_ACCEPTED nikaia run scripts/ledgers.nika -- --check --exe "$PWD/target/release/nikaia"

      # The accepted-programs sweep (#705) of this shard's own dump, right
      # after its tests: no job waits for the slowest shard to sweep them all.
      - name: Accepted-programs sweep of this shard (accepted-sweep)
        if: success() || failure()
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
          NIKAIA_SWEEP_PART: '1'
        run: |
          set -o pipefail
          mkdir -p "$NIKAIA_DUMP_ACCEPTED"
          echo "$(ls "$NIKAIA_DUMP_ACCEPTED" | wc -l) dumped programs"
          it=$(awk -F'\t' '$1 ~ /\/it-[0-9a-f]+$/ {print $1}' target/release/test-binaries.tsv)
          itdir=$(awk -F'\t' '$1 ~ /\/it-[0-9a-f]+$/ {print $2}' target/release/test-binaries.tsv)
          (cd "$itdir" && "$it" accepted_sweep:: --ignored) 2>&1 | tee "$RUNNER_TEMP/sweep.log"

      - name: Name the sweep's failures
        if: failure()
        run: |
          grep -E '^[0-9a-f]{16} \(|^error(\[E[0-9]+\])?:|^[0-9]+ programs: |panicked at' "$RUNNER_TEMP/sweep.log" | head -60 | sed 's/^/::error::/' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted-${{ inputs.arch }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/accepted
          retention-days: 1
          if-no-files-found: ignore

  # **The performance gate** (#2811): after the tests, every row of
  # `benches/perf.baseline` counted under callgrind (`scripts/perfgate.nika`),
  # the compiler and the Rust references built with one codegen unit
  # (`[profile.perf]`); a row over its tolerance, or whose output changed,
  # fails the job, and so the suite, like a failing test. Its `PERF` lines go
  # into the driver's suite log (`drive_ci_perf`). The x86 leg only: the
  # counts are the architecture's.
  perf:
    needs: test
    if: inputs.arch == 'x64'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Install valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind

      - name: Restore the cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      # The perf build of an earlier commit: one codegen unit takes its crates
      # from there, and only what changed is compiled again.
      - name: Restore the perf build
        id: perfbuild
        uses: actions/cache/restore@v4
        with:
          path: |
            target/perf
            target/perfgate/game-target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Build the measured compiler
        run: cargo build --quiet --profile perf -p nikaia

      - name: Count the baseline (perfgate)
        run: target/perf/nikaia run scripts/perfgate.nika

      - name: Save the perf build
        if: always() && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: |
            target/perf
            target/perfgate/game-target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

  # **Every entry of the sweep's allow-list is still checked** (#705). Each
  # shard sweeps its own dump (`NIKAIA_SWEEP_PART`) and judges only the
  # entries that dump holds; whether an entry is in no dump at all - no test
  # checks that program any more - needs the dumps of all shards. It reads
  # their file names only, so it takes seconds after the slowest shard, and
  # runs for the x86 leg only: which programs the tests emit does not depend
  # on the architecture, and the ARM leg skips the samples, whose programs
  # are in the list too.
  sweep:
    needs: test
    if: always() && inputs.arch == 'x64' && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: accepted-${{ inputs.arch }}-*
          path: ${{ runner.temp }}/accepted
          merge-multiple: true

      - name: Every allow-list entry is in some shard's dump
        run: |
          mkdir -p "$RUNNER_TEMP/accepted"
          echo "$(ls "$RUNNER_TEMP/accepted" | wc -l) dumped programs"
          status=0
          for hash in $(sed -n '/^const KNOWN/,/^];/p' crates/nikaia/tests/it/accepted_sweep.rs | grep -o '"[0-9a-f]\{16\}"' | tr -d '"'); do
            if ! ls "$RUNNER_TEMP/accepted" | grep -q -- "-$hash\.nika$"; then
              echo "::error::$hash is no longer checked by any test: take it off the allow-list in crates/nikaia/tests/it/accepted_sweep.rs"
              status=1
            fi
          done
          exit $status
