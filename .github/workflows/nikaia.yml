name: Nikaia

# **Once per change, not twice.** A push to a pull request's branch used to
# start the workflow as a `push` and again as a `pull_request`, the same
# commit twice. Pull requests run as `pull_request`; `develop` run
# on their push; everything runs weekly and by hand.
#
# **`develop` is where every change lands at once; `main` is what was tested**
# (#437). A push to `develop` runs everything, and when every job passed,
# `promote` moves `main` forward to that commit. Runs on `develop` queue rather
# than cancel, so `main` moves on with every finished run however often
# `develop` is pushed.
#
# **The driver's suite runs here, on a `ci/<lane>` branch** (owner,
# 2026-11-01): `scripts/drive.nika` force-pushes the commit it would push to
# `develop` to `ci/<lane>` and waits for this workflow's answer instead of
# running the full suite on the shared machine. Green, it pushes the same commit
# to `develop`, whose run finds that run (`changes`, *Tested on a ci/ branch*)
# and goes straight to `promote` instead of testing the commit a second time.
on:
  push:
    branches: [develop, "ci/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# A newer push to the same pull request makes the older run's answer moot.
# A push to develop gets a group of its own (its run id): in one shared group a
# *pending* run is cancelled by the next pending one even with
# cancel-in-progress off (GitHub keeps one running and one pending run per
# group), so most develop commits never got an answer. `promote` only moves
# main forward (it skips a commit main already contains), so runs finishing
# out of order are safe. A `ci/` branch is one driver lane's: its newer push
# makes the older run moot, as on a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/ci/') && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the slower jobs this change needs (`scripts/ci-changes.sh` says
  # why for each). The compiler's own job always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      unsafe: ${{ steps.tested.outputs.unsafe || steps.decide.outputs.unsafe }}
      floor: ${{ steps.tested.outputs.floor || steps.decide.outputs.floor }}
      arm64: ${{ steps.tested.outputs.arm64 || steps.decide.outputs.arm64 }}
      docs: ${{ steps.tested.outputs.docs || steps.decide.outputs.docs }}
      examples: ${{ steps.tested.outputs.examples || steps.decide.outputs.examples }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One line per run: the supervisor counts the CPU models the pool gives.
      - name: Runner CPU
        run: echo "runner-cpu $(rustc --print target-cpus | grep native) nproc=$(nproc)"

      # A develop commit the driver's suite already ran green on a `ci/` branch
      # (header) is not tested again: every build and test job is off and
      # `promote` moves main onto it.
      - name: Tested on a ci/ branch
        id: tested
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "Nikaia" and (.head_branch | startswith("ci/")))] | length' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "$GITHUB_SHA ran green on a ci/ branch: not tested again"
            for k in unsafe floor arm64 examples; do echo "$k=false" >>"$GITHUB_OUTPUT"; done
            echo "docs=true" >>"$GITHUB_OUTPUT"
            echo "done=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        if: steps.tested.outputs.done != 'true'
        run: sh scripts/ci-changes.sh
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # A documentation-only change skips the build and test jobs; these cheap
      # checks still run for it (the full ones run again in bootstrap_compiler).
      - name: Cheap checks (documentation-only change)
        if: steps.decide.outputs.docs == 'true'
        run: |
          python3 scripts/check-adr-refs.py
          python3 scripts/badges.py --check

  # The oldest Rust Nikaia claims (ADR-305), with the whole suite run on it:
  # the compiler, `std`, and every program the tests emit. The channel for
  # building stays `rust-toolchain.toml`'s (ADR-001 D1); this checks the claim.
  #
  # On every push to main and weekly; on a pull request only where a floor is
  # declared or can move (a manifest, the lock file, the toolchain).
  #
  # **Switched off until Nikaia is stable** (owner's decision, 2026-10-08): the
  # suite runs on the current Rust only. The floor is a goal again later; until
  # then the job only held every push's answer up and spent runner hours.
  # To switch it back on, restore the `if:` below and its place in `promote`.
  rust_floor:
    needs: changes
    if: false && needs.changes.outputs.floor == 'true'
    runs-on: ubuntu-latest
    # A hang is a failure, in an hour and a half (see `arm64`).
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache cargo registry and the floor's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/floor
            target/floor-unsafe
          key: ${{ runner.os }}-cargo-floor-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-floor-

      - name: Run the suite on the floor
        run: sh scripts/check-floor.sh

  # The compiler, `std` and every program the tests emit, on 64-bit ARM
  # (aarch64 Linux: Graviton, Ampere, a Raspberry Pi 4/5, Apple silicon under
  # Linux). Nothing in the tree names the architecture - no `asm!`, no
  # `target_arch`, and the triple the `target` switch names is never handed to
  # `rustc` - so a build here is a native build, and this job is what says it
  # stays one. The `unsafe` crates run too: atomics and memory ordering are
  # where a weaker memory model than x86's would show.
  #
  # Weekly, and on a push or pull request only where the runtime, an `unsafe`
  # crate or a dependency changed (`scripts/ci-changes.sh`).
  arm64:
    needs: changes
    if: needs.changes.outputs.arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    # **A hang is a failure, and says so in an hour and a half** rather than
    # at GitHub's six: on `main` the runs queue behind one another, so a job
    # that hangs held every later push's answer for six hours, and the run
    # waiting behind it was cancelled by the next - the arm64 hang of 0.0.252
    # to 0.0.258 was hidden that way (ADR-121 §5).
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-stable-

      - name: Build the workspace
        run: cargo build --workspace --release

      - name: Build the tests
        run: cargo test --workspace --release --no-run

      # The accepted-programs sweep (#705) runs here too, on this machine's
      # dump; the `sweep` job runs it on x86.
      - name: Test
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          set -o pipefail
          cargo test --workspace --release --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Name the failing tests
        if: failure()
        run: |
          grep -E '^test .* FAILED' "$RUNNER_TEMP/test.log" | sed 's/^/::error::/' || true
          awk '/^failures:$/{f=1;next} /^test result/{f=0} f&&/^    /{print "::error::failed: "$1}' "$RUNNER_TEMP/test.log" | sort -u | head -50 || true

      - name: Accepted-programs sweep (accepted-sweep)
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          set -o pipefail
          cargo test --release -p nikaia --test it accepted_sweep:: -- --ignored 2>&1 | tee "$RUNNER_TEMP/sweep.log"

      # The sweep's log is not readable outside GitHub's page, so its red was
      # invisible (runs from c7e5b66 on): each failing program, its first
      # `rustc` error, a stale allow-list entry and the panic become annotations.
      - name: Name the sweep's failures
        if: failure()
        run: |
          grep -E '^[0-9a-f]{16} \(|^error(\[E[0-9]+\])?:|^[0-9]+ programs: |holds no program|panicked at' "$RUNNER_TEMP/sweep.log" | head -60 | sed 's/^/::error::/' || true

      - name: Test the unsafe crates
        run: |
          for dir in crates/unsafe/*/; do
            echo "::group::$dir"
            (cd "$dir" && cargo test --quiet --all-features)
            echo "::endgroup::"
          done

  # **A documentation-only change that edits an example** (`scripts/ci-changes.sh`,
  # `examples`): the compiler is built, and every `nika` example of website/
  # and guide/ goes through `nikaia check` and `nikaia lower`, compared with
  # tests/page-examples/EXPECTED.txt. No `rustc` runs on the examples, so after the
  # build it takes about a minute. A change to the prose alone skips it.
  examples:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      - name: Build the compiler
        run: cargo build --release -p nikaia

      - name: The examples of the website and the guide
        run: |
          export PATH="$PWD/target/release:$PATH"
          cd tests/page-examples && nikaia test

  # **`main` moves only to a commit `develop` tested** (#437). Every job above
  # ran or was not needed, and none failed: `main` is fast-forwarded to this
  # run's commit - never to `develop`'s tip, which may have moved on during the
  # run and is promoted by its own run. A commit `main` already has is left
  # alone. A push that is not a fast-forward is refused, so a commit that landed
  # on `main` some other way stops the promotion until `develop` has it.
  promote:
    needs: [changes, arm64, unsafe_crates, build, lint, test, sweep, examples]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to the tested commit
        id: ff
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main already has $GITHUB_SHA"
          else
            echo "old=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
            git push origin "${GITHUB_SHA}:refs/heads/main"
          fi

      # The push above starts no workflow either (GITHUB_TOKEN), so the website
      # is started by hand-off; workflow_dispatch is allowed with that token.
      - name: Deploy the website
        if: steps.ff.outputs.old != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main

      # A push made with this job's token closes no issue, whatever its commits
      # say (#440), so the issues they fix are closed here.
      - name: Close the issues the promoted commits fix
        if: steps.ff.outputs.old != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fixed-issues.py "${{ steps.ff.outputs.old }}" "$GITHUB_SHA" |
          while read -r number sha; do
            if [ "$(gh issue view "$number" --json state --jq .state)" = OPEN ]; then
              gh issue close "$number" --reason completed \
                --comment "Fixed by $sha, now on \`main\` (promoted after CI passed)."
            fi
          done

  # The crates that hold `unsafe`, one topic each (ADR-218). Each is its own
  # workspace and is checked on its own: tests and lints on stable, and Miri on
  # nightly - which checks the crates' tests and nothing the compiler builds,
  # so ADR-001 D1's one toolchain for building stands.
  #
  # Only where one of them, or the script that checks them, changed: nothing
  # outside a crate is in its build.
  unsafe_crates:
    needs: changes
    if: needs.changes.outputs.unsafe == 'true'
    runs-on: ubuntu-latest
    # A hang is a failure, in an hour and a half (see `arm64`).
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install stable, and nightly with Miri
        run: |
          rustup show
          rustup toolchain install nightly --component miri --profile minimal
          cargo +nightly miri setup

      - name: Check every crate under crates/unsafe
        run: sh scripts/check-unsafe-crates.sh

  # **Build once, test in parallel** (the owner's goal, 2026-11-14: a run in
  # minutes, not 40-70). The full suite was one `cargo test` on four threads:
  # the 2885 short tests were done after 27 minutes, and twelve whole-tree
  # tests held the step to 43 - the compiler's test package at both settings
  # alone took 38 minutes. Now `build` compiles the workspace and every test
  # binary once and hands `target/release` on as an artifact; each `test`
  # shard runs its part of the binaries directly (no second `cargo`, which
  # would rebuild every workspace crate after a fresh checkout), and `sweep`
  # runs the accepted-programs sweep on the dumps of all shards.
  #
  # One leg because there is one toolchain (ADR-001 D1): `rust-toolchain.toml`
  # names it and `rustup show` installs exactly that.
  build:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      - name: Build the workspace
        run: cargo build --workspace --release

      # Every test binary and the directory cargo would run it in (its
      # package's), one per line: what the shards run.
      - name: Build the tests
        run: |
          set -o pipefail
          cargo test --workspace --release --no-run --message-format=json |
            jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
                   | "\(.executable)\t\(.manifest_path | sub("/Cargo.toml$"; ""))"' |
            sort -u >target/release/test-binaries.tsv
          cat target/release/test-binaries.tsv

      # The compiler, `std`'s rlibs (the tests hand emitted programs to rustc
      # with `--extern` into `deps/`) and the test binaries; not cargo's
      # bookkeeping. Every shard runs on the same path, so the paths compiled
      # into the binaries (`CARGO_BIN_EXE_nikaia`, the checkout) hold there.
      - name: Pack the build
        run: tar --exclude=target/release/incremental --exclude=target/release/.fingerprint -I 'zstd -T0 -1' -cf "$RUNNER_TEMP/release.tar.zst" target/release

      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}/release.tar.zst
          retention-days: 1
          compression-level: 0

  # The cheap checks, beside `build` rather than in front of the tests:
  # formatting, ADR citations, badges and clippy need no release build.
  lint:
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - name: Cache cargo registry and the clippy build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Check formatting
        run: cargo fmt --all --check

      # A decision is only citable if its number is stable, so a dangling
      # `ADR-023 D7` is as much a defect as a dangling link.
      - name: Check ADR citations resolve
        run: python3 scripts/check-adr-refs.py

      # The README's badges are drawn from the specification's version line
      # and the self-hosting count; a hand-edited SVG drifts.
      - name: Check the README's badges are current
        run: python3 scripts/badges.py --check

      - name: No clippy warnings
        run: cargo clippy --all-targets -- -D warnings

  # **The suite, in shards that run at once.** `it-K` is every K-th short
  # test of the `it` binary (round-robin over the sorted names, so each module
  # spreads over all three), `it-0` also every other test binary; `heavy-*`
  # are the whole-tree tests, two or three to a runner where they fit beside
  # each other; `compiler-K` is every K-th program of `tests/compiler`, at
  # both settings - the test `the_compiler_test_package_passes_at_both_settings`
  # runs that package in one go and is skipped in the `it` shards for it.
  # A new whole-tree test that makes an `it` shard slow belongs in `HEAVY`.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - it-0
          - it-1
          - it-2
          - heavy-map-trust
          - heavy-sysroot-cores
          - heavy-sysroot-pair
          - heavy-corpus
          - heavy-rest
          - compiler-0
          - compiler-1
          - compiler-2
          - compiler-3
          - compiler-4
    env:
      SHARD: ${{ matrix.shard }}
      IT_SHARDS: 3
      COMPILER_SHARDS: 5
      # The whole-tree tests of `it`, by shard; every one is skipped in `it-K`.
      HEAVY_MAP_TRUST: map_trust::the_real_tools_package_lowers_the_same_read_backwards
      HEAVY_SYSROOT_CORES: sysroot::the_tools_lower_the_same_on_one_thread_as_on_every_core
      HEAVY_SYSROOT_PAIR: >-
        sysroot::the_committed_rust_is_what_this_compiler_lowers
      HEAVY_CORPUS: >-
        sequences::the_corpus_has_no_more_unanswered_method_calls_than_it_had
        language::the_build_time_package_passes_its_own_tests
      HEAVY_REST: >-
        project::the_http_package_serves_its_example
        bytes::the_corpus_needs_no_tether
        send::no_program_in_the_repository_has_a_crossing_refused
        contracts::a_toolchain_module_is_not_part_of_std
        fmt::every_nika_file_formats_to_the_same_tree_and_a_fixed_point
      HEAVY_ELSEWHERE: nikaia_test::the_compiler_test_package_passes_at_both_settings
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      # The crates.io sources the tests' own Cargo builds read offline (a
      # test that builds a Rust library resolves `winnow`'s dependencies).
      - name: Restore the cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: tar -I zstd -xf "$RUNNER_TEMP/release.tar.zst"

      # Each one-file program a checker test accepts is written to the dump
      # the `sweep` job reads (#705).
      - name: Test
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          set -o pipefail
          # As `cargo test` runs a test binary: with the toolchain's libraries
          # on the loader's path. A program a test builds with `nikaia run`
          # links `std` dynamically and was only ever run so.
          sysroot=$(rustc --print sysroot)
          export LD_LIBRARY_PATH="$sysroot/lib:$(rustc --print target-libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          it=$(awk -F'\t' '$1 ~ /\/deps\/it-[0-9a-f]+$/ {print $1}' target/release/test-binaries.tsv)
          itdir=$(awk -F'\t' '$1 ~ /\/deps\/it-[0-9a-f]+$/ {print $2}' target/release/test-binaries.tsv)
          heavy="$HEAVY_MAP_TRUST $HEAVY_SYSROOT_CORES $HEAVY_SYSROOT_PAIR $HEAVY_CORPUS $HEAVY_REST $HEAVY_ELSEWHERE"
          run_it() { (cd "$itdir" && "$it" --exact "$@"); }
          case "$SHARD" in
          it-*)
            k=${SHARD#it-}
            (cd "$itdir" && "$it" --list --format terse) | sed -n 's/: test$//p' | sort >"$RUNNER_TEMP/all"
            printf '%s\n' $heavy | sort >"$RUNNER_TEMP/heavy"
            comm -23 "$RUNNER_TEMP/all" "$RUNNER_TEMP/heavy" |
              awk -v k="$k" -v n="$IT_SHARDS" 'NR % n == k' >"$RUNNER_TEMP/mine"
            echo "$(wc -l <"$RUNNER_TEMP/mine") of $(wc -l <"$RUNNER_TEMP/all") tests of it"
            status=0
            xargs -a "$RUNNER_TEMP/mine" -d '\n' sh -c 'd=$0 b=$1; shift; cd "$d" && exec "$b" --exact "$@"' "$itdir" "$it" 2>&1 |
              tee "$RUNNER_TEMP/test.log" || status=1
            if [ "$k" = 0 ]; then
              while IFS="$(printf '\t')" read -r bin dir; do
                [ "$bin" = "$it" ] && continue
                echo "::group::$bin"
                (cd "$dir" && "$bin") 2>&1 | tee -a "$RUNNER_TEMP/test.log" || status=1
                echo "::endgroup::"
              done <target/release/test-binaries.tsv
            fi
            exit $status
            ;;
          heavy-*)
            var=HEAVY_$(echo "${SHARD#heavy-}" | tr 'a-z-' 'A-Z_')
            eval "names=\$$var"
            run_it $names 2>&1 | tee "$RUNNER_TEMP/test.log"
            ;;
          compiler-*)
            k=${SHARD#compiler-}
            filters=$(ls tests/compiler/tests/*.nika | sed 's|.*/||; s|\.nika$||' | sort |
              awk -v k="$k" -v n="$COMPILER_SHARDS" 'NR % n == k {printf " --filter %s", $0}')
            # As the test `the_compiler_test_package_passes_at_both_settings` runs it.
            env -u CARGO_TARGET_DIR -u RUST_BACKTRACE NIKAIA_CACHE_DIR="$PWD/target/nikaia-project-tests" \
              ./target/release/nikaia test --both-settings --project tests/compiler $filters 2>&1 |
              tee "$RUNNER_TEMP/test.log"
            ;;
          esac

      - name: Name the failing tests
        if: failure()
        run: |
          grep -E '^test .* FAILED|\.\.\. FAILED' "$RUNNER_TEMP/test.log" | sed 's/^/::error::/' | head -50 || true
          awk '/^failures:$/{f=1;next} /^test result/{f=0} f&&/^    /{print "::error::failed: "$1}' "$RUNNER_TEMP/test.log" | sort -u | head -50 || true

      # What were the bootstrap job's last steps; they need the compiler only.
      - name: The samples, the page examples and the ledgers
        if: matrix.shard == 'it-1'
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          export PATH="$PWD/target/release:$PATH"
          for sample in tests/samples/*.nika; do
            echo "::group::$sample"
            nikaia interpret "$sample"
            echo "::endgroup::"
          done
          (cd tests/page-examples && nikaia test)
          # The ledgers of tests/compiler are committed like a lockfile
          # (ADR-268 D2, D6): a change to its src/ that leaves them stale fails.
          (cd tests/compiler && nikaia build --locked)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted-${{ matrix.shard }}
          path: ${{ runner.temp }}/accepted
          retention-days: 1
          if-no-files-found: ignore

  # **Every program a checker test accepts compiles in `rustc`** (#705): the
  # dumps of all shards (content-addressed names, so they merge), lowered and
  # checked by `rustc --emit=metadata` in batches. A refusal not on the test's
  # allow-list fails, and so does an entry that compiles.
  sweep:
    needs: test
    if: always() && needs.test.result != 'skipped' && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the toolchain the repository names
        run: rustup show

      - uses: actions/download-artifact@v4
        with:
          name: release-build
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          pattern: accepted-*
          path: ${{ runner.temp }}/accepted
          merge-multiple: true

      - name: Accepted-programs sweep (accepted-sweep)
        env:
          NIKAIA_DUMP_ACCEPTED: ${{ runner.temp }}/accepted
        run: |
          set -o pipefail
          tar -I zstd -xf "$RUNNER_TEMP/release.tar.zst"
          echo "$(ls "$NIKAIA_DUMP_ACCEPTED" | wc -l) dumped programs"
          it=$(awk -F'\t' '$1 ~ /\/deps\/it-[0-9a-f]+$/ {print $1}' target/release/test-binaries.tsv)
          itdir=$(awk -F'\t' '$1 ~ /\/deps\/it-[0-9a-f]+$/ {print $2}' target/release/test-binaries.tsv)
          (cd "$itdir" && "$it" accepted_sweep:: --ignored) 2>&1 | tee "$RUNNER_TEMP/sweep.log"

      # The sweep's log is not readable outside GitHub's page: each failing
      # program, its first `rustc` error, a stale allow-list entry and the
      # panic become annotations.
      - name: Name the sweep's failures
        if: failure()
        run: |
          grep -E '^[0-9a-f]{16} \(|^error(\[E[0-9]+\])?:|^[0-9]+ programs: |holds no program|panicked at' "$RUNNER_TEMP/sweep.log" | head -60 | sed 's/^/::error::/' || true
