# The Rust half of the Benchmarks Game programs (#1611): each the fastest Rust
# entry the game lists for its problem, copied with its header, a binary of its
# own. A workspace of its own, out of the repository's; `game.nika` builds it.
[package]
name = "game-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "n-body"
path = "n-body/rust-9.rs"

[[bin]]
name = "spectral-norm"
path = "spectral-norm/rust-6.rs"

[[bin]]
name = "fannkuch-redux"
path = "fannkuch-redux/rust-6.rs"

[[bin]]
name = "binary-trees"
path = "binary-trees/rust-5.rs"

[[bin]]
name = "fasta"
path = "fasta/rust-7.rs"

[[bin]]
name = "k-nucleotide"
path = "k-nucleotide/rust-7.rs"

[[bin]]
name = "reverse-complement"
path = "reverse-complement/rust-1.rs"

# Not a game entry: the library people use against the json package (#1620),
# one binary for the three inputs.
[[bin]]
name = "json"
path = "json/rust-tree.rs"

# The game's Rust entries link against its `rust-libs`; spectral-norm's and
# fannkuch-redux's need rayon, binary-trees' rayon and bumpalo, fasta's
# num_cpus and spin, k-nucleotide's futures, tokio-threadpool, itertools, num
# and hashbrown, reverse-complement's memchr and rayon; json's serde and
# serde_json, with the features `json/rust-tree.rs` names.
[dependencies]
rayon = "1"
bumpalo = "3"
num_cpus = "1"
spin = "0.9"
futures = "0.1"
tokio-threadpool = "0.1"
itertools = "0.14"
num = "0.4"
hashbrown = "0.15"
memchr = "2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "unbounded_depth"] }

# The game's `rustc -C opt-level=3 -C codegen-units=1`; its
# `-C target-cpu=ivybridge` is passed by `game.nika` in `RUSTFLAGS`.
[profile.release]
opt-level = 3
codegen-units = 1
incremental = false

[workspace]
