# The Rust half of the Benchmarks Game programs (#1611): each the fastest Rust
# entry the game lists for its problem, copied with its header, a binary of its
# own. A workspace of its own, out of the repository's; `game.nika` builds it.
[package]
name = "game-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "n-body"
path = "n-body/rust-9.rs"

[[bin]]
name = "spectral-norm"
path = "spectral-norm/rust-6.rs"

[[bin]]
name = "fannkuch-redux"
path = "fannkuch-redux/rust-6.rs"

[[bin]]
name = "binary-trees"
path = "binary-trees/rust-5.rs"

[[bin]]
name = "fasta"
path = "fasta/rust-7.rs"

# The game's Rust entries link against its `rust-libs`; spectral-norm's and
# fannkuch-redux's need rayon, binary-trees' rayon and bumpalo, fasta's
# num_cpus and spin.
[dependencies]
rayon = "1"
bumpalo = "3"
num_cpus = "1"
spin = "0.9"

# The game's `rustc -C opt-level=3 -C codegen-units=1`; its
# `-C target-cpu=ivybridge` is passed by `game.nika` in `RUSTFLAGS`.
[profile.release]
opt-level = 3
codegen-units = 1
incremental = false

[workspace]
