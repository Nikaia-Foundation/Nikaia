# The solver's measuring rod (ADR-270 D17): a program over the package
# `logic`, built by `scripts/solver.nika`.
[package]
name = "solver_rod"
version = "0.1.0"

[dependencies]
logic = { path = ".." }

# The SMT-LIB files it reads are the ones named on its command line:
# opening them is the rod's job (ADR-raw-sinks-1 D15).
[allow]
untrusted-paths-read = ["args"]
